[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-subtitle-studio"
description = "Local, free, multilingual subtitle production."
dynamic = ["version"]

[tool.setuptools.packages.find]
# This repository is a flat layout with several top-level folders; without this, setuptools refuses to guess.
include = ["app*"]

[tool.setuptools.dynamic]
# The version is single-sourced from app/__init__.py; nothing else may hard-code it.
version = {attr = "app.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# basetemp keeps pytest temp files inside the project; avoids permission problems in the system Temp folder.
addopts = "-ra --basetemp=.pytest_tmp -m \"not integration\""
markers = [
    "integration: needs real models, FFmpeg, or network (deselect with -m 'not integration')",
]
